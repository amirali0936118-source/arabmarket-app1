<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إضافة إعلان | Arab Market</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

</head>


<body>


<header class="header">

<h2>إضافة إعلان</h2>

</header>



<main class="add-page">


<form id="adForm" class="ad-form">



<h3>
معلومات الإعلان
</h3>



<label>
عنوان الإعلان
</label>

<input 
id="title"
type="text"
placeholder="مثال: سيارة تويوتا للبيع"
required>



<label>
القسم
</label>

<select id="category">

<option>سيارات</option>
<option>عقارات</option>
<option>هواتف</option>
<option>إلكترونيات</option>
<option>أثاث</option>
<option>وظائف</option>
<option>خدمات</option>

</select>



<label>
السعر
</label>

<input
id="price"
type="number"
placeholder="السعر">



<label>
المدينة
</label>

<select id="city">

<option>دبي</option>
<option>الرياض</option>
<option>بغداد</option>
<option>القاهرة</option>
<option>الكويت</option>
<option>الدوحة</option>
<option>أبوظبي</option>

</select>



<label>
رقم الهاتف
</label>

<input
id="phone"
type="tel"
placeholder="05xxxxxxxx">



<label>
صور الإعلان
</label>

<input
id="image"
type="file"
accept="image/*">



<div id="imagePreview"></div>



<label>
وصف الإعلان
</label>

<textarea
id="description"
placeholder="اكتب تفاصيل الإعلان">
</textarea>



<button class="publish-btn">

نشر الإعلان

</button>



</form>


</main>



<script src="js/storage.js"></script>

<script src="js/add.js"></script>


</body>

</html>
